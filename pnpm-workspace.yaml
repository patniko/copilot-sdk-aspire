packages:
  - contracts
  - src/*
  - tests
  - configurator

# Build scripts are allowed only for packages that need them.
onlyBuiltDependencies:
  - esbuild

# koffi backs the SDK's experimental in-process runtime host, which is not used (stdio runtime only).
ignoredBuiltDependencies:
  - koffi

# Note: keep lockfile-affecting settings out of this file. `aspire run`/`aspire deploy` install the
# AppHost with `pnpm install --ignore-workspace`, which rewrites the lockfile without them.
