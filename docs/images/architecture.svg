<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1715" viewBox="0 0 1280 1715" role="img" aria-labelledby="title description">
  <title id="title">Copilot SDK and Aspire service architecture</title>
  <desc id="description">A caller authenticates to the agent API. API and dispatcher access PostgreSQL. The default executor pool runs unprivileged SDK runners using the inference gateway. The optional direct container host remains separate. Experimental local hybrid mode adds protected CLI provisioning, a connection broker that verifies one-use tickets and forwards CLI connections to their session's placement, and a shared in-process worker that runs many shared harnesses with PostgreSQL session files, approval modes, and web and remote MCP access through an egress filter; an operator-owned Docker controller starts one-shot execution containers and durable completion returns results to the conversation. It also starts one resumable session container per isolated conversation session, which the broker reaches with a per-allocation credential; the container keeps only allocation-scoped credentials, stops when idle, and resumes from its retained volume. Separately, the local configurator can send a description and catalog through a request-owned SDK to GitHub Copilot using server-side GitHub authentication; configuration returns to the unsaved editor and code proposals are never installed. Azure hybrid and two-real-account qualification remain open. Outbound network isolation is not enforced.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#576574"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172b4d; }
      .title { font-size: 27px; font-weight: 700; }
      .heading { font-size: 19px; font-weight: 700; }
      .body { font-size: 15px; }
      .label { font-size: 14px; fill: #42526e; }
      .small { font-size: 13px; fill: #42526e; }
      .edge { fill: none; stroke: #576574; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1280" height="1715" fill="#ffffff"/>
  <text x="32" y="42" class="title">Batch jobs and optional hosted conversations</text>
  <text x="32" y="70" class="body">Current implementation | service responsibilities and credential boundaries</text>

