  <text x="170" y="295" class="heading" text-anchor="middle">agent-api</text>
  <text x="170" y="321" class="body" text-anchor="middle">Admission and caller actions</text>
  <text x="170" y="347" class="body" text-anchor="middle">Console, jobs, events, inputs</text>

  <rect x="345" y="265" width="235" height="105" rx="12" fill="#f0eaff" stroke="#8250df"/>
  <text x="462" y="295" class="heading" text-anchor="middle">PostgreSQL</text>
  <text x="462" y="321" class="body" text-anchor="middle">Shared transactional ledger</text>
  <text x="462" y="347" class="body" text-anchor="middle">Jobs, attempts, events, inputs</text>

  <rect x="645" y="265" width="275" height="105" rx="12" fill="#eaf2ff" stroke="#3572b0"/>
  <text x="782" y="295" class="heading" text-anchor="middle">job-dispatcher</text>
  <text x="782" y="321" class="body" text-anchor="middle">Leases, fencing, retries</text>
  <text x="782" y="347" class="body" text-anchor="middle">Capabilities and attempt reports</text>
  <path d="M 285 317 H 345" class="edge"/>
  <path d="M 645 317 H 580" class="edge"/>
  <rect x="985" y="265" width="270" height="105" rx="12" fill="#e6f6ed" stroke="#22863a"/>
  <text x="1120" y="295" class="heading" text-anchor="middle">GitHub Copilot</text>
  <text x="1120" y="321" class="body" text-anchor="middle">Native demo model access</text>
  <text x="1120" y="347" class="body" text-anchor="middle">Owner's GitHub credential</text>
  <text x="462" y="391" class="small" text-anchor="middle">Both services use the shared job-store library.</text>

  <rect x="595" y="450" width="325" height="205" rx="14" fill="#fff4df" stroke="#b7791f"/>
  <text x="757" y="480" class="heading" text-anchor="middle">agent-executor</text>
  <text x="757" y="505" class="body" text-anchor="middle">Service key; polls the dispatcher</text>
  <rect x="615" y="535" width="285" height="94" rx="10" fill="#ffffff" stroke="#b7791f"/>
  <text x="757" y="560" class="heading" text-anchor="middle">SDK runner + packaged tools</text>
  <text x="757" y="585" class="body" text-anchor="middle">Unprivileged uid per executor slot</text>
  <text x="757" y="609" class="body" text-anchor="middle">Private workspace; JSONL protocol</text>
  <path d="M 820 450 V 370" class="edge"/>
  <text x="832" y="408" class="label">claim /</text>
  <text x="832" y="427" class="label">heartbeat</text>

  <rect x="65" y="520" width="300" height="115" rx="12" fill="#e6f6ed" stroke="#22863a"/>
  <text x="215" y="548" class="heading" text-anchor="middle">inference-gateway</text>
  <text x="215" y="573" class="body" text-anchor="middle">Approved model routes</text>
  <text x="215" y="597" class="body" text-anchor="middle">Checks capability and reported usage</text>
  <text x="215" y="620" class="body" text-anchor="middle">Owns model-provider identity</text>
  <path d="M 615 580 H 365" class="edge"/>
  <text x="480" y="565" class="label" text-anchor="middle">job capability</text>
  <path d="M 215 520 V 430 H 710 V 370" class="edge"/>
  <text x="455" y="418" class="label" text-anchor="middle">capability status + usage reports</text>

  <rect x="985" y="520" width="270" height="115" rx="12" fill="#e6f6ed" stroke="#22863a"/>
  <text x="1120" y="548" class="heading" text-anchor="middle">Existing Foundry account</text>
  <text x="1120" y="575" class="body" text-anchor="middle">OpenAI v1 chat completions</text>
  <text x="1120" y="600" class="body" text-anchor="middle">Customer-owned deployment</text>
  <text x="1120" y="622" class="small" text-anchor="middle">Outside the service lifecycle</text>
  <path d="M 215 635 V 688 H 1120 V 635" class="edge"/>
  <text x="660" y="678" class="label" text-anchor="middle">Entra-authenticated inference: gateway identity only</text>

  <rect x="24" y="754" width="1231" height="178" rx="12" fill="#f6f8fa" stroke="#8250df"/>
  <text x="44" y="782" class="heading">Optional demo profiles: GitHub-native or managed</text>
  <rect x="44" y="803" width="190" height="88" rx="10" fill="#eaf2ff" stroke="#3572b0"/>
  <text x="139" y="834" class="heading" text-anchor="middle">Copilot CLI</text>
  <text x="139" y="860" class="body" text-anchor="middle">Eligible, qualified client</text>
  <rect x="285" y="803" width="250" height="88" rx="10" fill="#eaf2ff" stroke="#3572b0"/>
  <text x="410" y="829" class="heading" text-anchor="middle">Connection paths</text>
  <text x="410" y="853" class="body" text-anchor="middle">Managed WSS: ticket + key pin</text>
  <text x="410" y="878" class="body" text-anchor="middle">GitHub: Mission Control/WPS</text>
  <rect x="590" y="803" width="280" height="88" rx="10" fill="#fff4df" stroke="#b7791f"/>
  <text x="730" y="829" class="heading" text-anchor="middle">agent-host</text>
  <text x="730" y="853" class="body" text-anchor="middle">Supervisor + isolated runtime</text>
  <text x="730" y="878" class="body" text-anchor="middle">Leased through the dispatcher</text>
  <rect x="930" y="803" width="300" height="88" rx="10" fill="#f0eaff" stroke="#8250df"/>
  <text x="1080" y="829" class="heading" text-anchor="middle">Persistent volume</text>
  <text x="1080" y="853" class="body" text-anchor="middle">Runtime history + shared workspace</text>
  <text x="1080" y="878" class="small" text-anchor="middle">Azure storage needs qualification</text>
  <path d="M 234 846 H 285" class="edge"/>
  <path d="M 535 846 H 590" class="edge"/>
  <path d="M 870 846 H 930" class="edge"/>
  <path d="M 730 803 V 737 H 45 V 578 H 65" class="edge"/>
  <text x="395" y="731" class="label" text-anchor="middle">managed: session capability to the gateway</text>
  <path d="M 845 803 V 743 H 1266 V 317 H 1255" class="edge"/>
  <text x="1060" y="733" class="label" text-anchor="middle">native: Copilot inference</text>
  <text x="44" y="919" class="small">Native mode uses Copilot billing/permissions. Managed mode needs runtime qualification. Neither is per-customer isolation.</text>

  <rect x="24" y="960" width="1231" height="400" rx="12" fill="#f6f8fa" stroke="#8250df"/>
  <text x="44" y="991" class="heading">Experimental local hybrid mode: shared harnesses, on-demand execution, session containers</text>
  <rect x="44" y="1020" width="240" height="96" rx="10" fill="#eaf2ff" stroke="#3572b0"/>
  <text x="164" y="1048" class="heading" text-anchor="middle">CLI + agent-api</text>
  <text x="164" y="1073" class="body" text-anchor="middle">Principal-bound provisioning</text>
  <text x="164" y="1097" class="body" text-anchor="middle">One-use ticket + pinned key</text>
  <rect x="44" y="1138" width="240" height="60" rx="10" fill="#eaf2ff" stroke="#3572b0"/>
  <text x="164" y="1163" class="heading" text-anchor="middle">connection-broker</text>
  <text x="164" y="1186" class="body" text-anchor="middle">Checks tickets; forwards bytes</text>
  <path d="M 164 1116 V 1136" class="edge"/>
  <path d="M 284 1168 H 400 V 1118" class="edge"/>
  <rect x="334" y="1020" width="260" height="96" rx="10" fill="#f0eaff" stroke="#8250df"/>
  <text x="464" y="1048" class="heading" text-anchor="middle">session-host</text>
  <text x="464" y="1073" class="body" text-anchor="middle">Many harnesses, one runtime</text>
  <text x="464" y="1097" class="body" text-anchor="middle">Session FS, budgets, approvals</text>
  <rect x="644" y="1020" width="260" height="96" rx="10" fill="#eaf2ff" stroke="#3572b0"/>
  <text x="774" y="1048" class="heading" text-anchor="middle">execution-controller</text>
  <text x="774" y="1073" class="body" text-anchor="middle">Operator-owned Docker access</text>
  <text x="774" y="1097" class="body" text-anchor="middle">Bounded allocations + teardown</text>
  <rect x="954" y="1020" width="276" height="96" rx="10" fill="#fff4df" stroke="#b7791f"/>
  <text x="1092" y="1048" class="heading" text-anchor="middle">One-shot Linux executors</text>
  <text x="1092" y="1073" class="body" text-anchor="middle">Scoped job + isolated runner</text>
  <text x="1092" y="1097" class="body" text-anchor="middle">Selected inputs; retained outputs</text>
  <path d="M 284 1068 H 334" class="edge"/>
  <path d="M 594 1068 H 644" class="edge"/>
  <path d="M 904 1068 H 954" class="edge"/>
  <text x="660" y="1143" class="label" text-anchor="middle">Model delegates; admission commits before allocation.</text>
  <path d="M 1200 1116 V 1176 H 464 V 1116" class="edge"/>
  <text x="640" y="1199" class="label" text-anchor="middle">Durable completion inbox + immutable artifact manifests</text>
  <rect x="644" y="1222" width="260" height="96" rx="10" fill="#fff4df" stroke="#b7791f"/>
  <text x="774" y="1250" class="heading" text-anchor="middle">Session containers</text>
  <text x="774" y="1275" class="body" text-anchor="middle">One isolated session each</text>
  <text x="774" y="1299" class="body" text-anchor="middle">Retained volume; idle stop</text>
  <path d="M 880 1116 V 1222" class="edge"/>
  <path d="M 164 1198 V 1270 H 644" class="edge"/>
  <text x="414" y="1260" class="label" text-anchor="middle">forwards with per-allocation credential</text>
  <text x="924" y="1255" class="small">Allocation-scoped credential only:</text>
  <text x="924" y="1275" class="small">own spec, readiness, heartbeats and</text>
  <text x="924" y="1295" class="small">session inference grants</text>
  <text x="44" y="1342" class="small">PostgreSQL owns state; the gateway owns inference credentials; web and remote MCP pass the worker's egress filter. No idle job pool. Azure and two-real-account gates remain open.</text>
  <rect x="24" y="1385" width="1231" height="175" rx="12" fill="#f6f8fa" stroke="#3572b0"/>
  <text x="44" y="1413" class="heading">Local assisted authoring: separate from deployed jobs and hosts</text>
  <rect x="44" y="1430" width="240" height="80" rx="10" fill="#eaf2ff" stroke="#3572b0"/>
  <text x="164" y="1460" class="heading" text-anchor="middle">Configurator browser</text>
  <text x="164" y="1486" class="body" text-anchor="middle">Description or manual form</text>
  <rect x="454" y="1430" width="310" height="80" rx="10" fill="#eaf2ff" stroke="#3572b0"/>
  <text x="609" y="1460" class="heading" text-anchor="middle">Companion + request SDK</text>
  <text x="609" y="1486" class="body" text-anchor="middle">No file/shell tools; validates drafts</text>
  <rect x="979" y="1430" width="251" height="80" rx="10" fill="#e6f6ed" stroke="#22863a"/>
  <text x="1104" y="1460" class="heading" text-anchor="middle">GitHub Copilot</text>
  <text x="1104" y="1486" class="body" text-anchor="middle">Not Foundry job inference</text>
  <path d="M 284 1470 H 454" class="edge"/>
  <text x="369" y="1454" class="small" text-anchor="middle">local session token</text>
  <path d="M 764 1470 H 979" class="edge"/>
  <text x="871" y="1454" class="small" text-anchor="middle">server GitHub identity</text>
  <text x="44" y="1540" class="small">Response: unsaved configuration for review, or inert tool-code JSON. No automatic saves, installations, or code execution.</text>

  <rect x="24" y="1585" width="1231" height="105" rx="12" fill="#fff4df" stroke="#b7791f"/>
  <text x="44" y="1614" class="heading">Boundary limitation: outbound network access is not enforced.</text>
  <text x="44" y="1642" class="body">Arrows show intended model paths, not a firewall. Batch runners have no provider, database, or service credentials.</text>
  <text x="44" y="1669" class="body">The configurator is local tooling, not in the deployed request path. Its Copilot identity stays server-side. See docs/SECURITY.md.</text>
</svg>
